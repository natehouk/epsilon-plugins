# Netlify: serve the static site in site/ (no build step).
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Each plugin's uri in plugins.json (plugins.epsilonrecords.com/<name>) lands on its card.

[[redirects]]
  from = "/monolith"
  to = "/#monolith"
  status = 301

[[redirects]]
  from = "/caldera"
  to = "/#caldera"
  status = 301

